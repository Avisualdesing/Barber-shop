<style>

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

</style></head><body>
<div id="login" hidden><h1>Barber Shop <b>Style</b></h1><p>Appointments app. Sign in once and this phone remembers you.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password"><label class="ck"><input type="checkbox" id="rem" checked><span>Keep me signed in on this phone (30 days)</span></label>
<button class="b" id="go" style="width:100%">Sign in</button><p id="msg"></p></div>
<div id="app" hidden>
<header><div class="wrap"><div class="hd"><h1>Citas<b>.</b></h1><button class="ib" id="rf" aria-label="Refresh">⟳</button><button class="ib" id="mn" aria-label="Menu">⋯</button></div><div class="tabs" id="tabs"></div></div><div id="net" hidden>Can’t reach the server. Showing the last data.</div></header>
<div class="menu" id="menu" hidden><a id="m1" href="./#settings">Site settings, hours &amp; agenda</a><a href="./">Open the website</a><button id="so">Sign out</button></div>
<main class="wrap" id="list"></main></div>
<div class="sheet" id="sheet" hidden></div>
<script>

const $=s=>document.querySelector(s),LS={get:k=>{try{return localStorage.getItem(k)||''}catch(_){return''}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(_){}}};

let TOK=LS.get(KEY),PW='',IN=false,TAB='p',ES=false,CFG=Object.assign({},DEF),DATA={pend:[],up:[],rev:[]},HL=(()=>{const m=/^#d-(\d{4}-\d{2}-\d{2})-(\d{4})$/.exec(location.hash);return m?m[1]+'-'+m[2]:null})(),SHEET=null,TM=null;
try{SHEET=JSON.parse(LS.get('bss-sheet')||'null')}catch(_){}
const post=(path,data)=>fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},PW?{password:PW}:{},TOK?{token:TOK}:{},data||{}))}).then(r=>{if(r.status===401)throw 401;if(!r.ok)throw r.status;return r.json()});

const remHref=s=>{const[y,m,x]=s.d.split('-').map(Number),[a,b]=s.t.split(':').map(Number),w=new Date(y,m-1,x,a,b).toLocaleString(LOC(),{weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});return'shortcuts://run-shortcut?name='+encodeURIComponent(CFG.remShortcut||DEF.remShortcut)+'&input=text&text='+encodeURIComponent('✂️ '+(s.n||'Client')+' — '+w)};
const showLogin=m=>{IN=false;$('#app').hidden=true;$('#login').hidden=false;$('#msg').textContent=m||'';clearInterval(TM)};
const enter=()=>{IN=true;$('#login').hidden=true;$('#app').hidden=false;load();clearInterval(TM);TM=setInterval(()=>{if(!document.hidden)load()},20000)};
const start=async()=>{if(!TOK){showLogin();return}try{await post('/login',{});enter()}catch(e){if(e===401){TOK='';LS.set(KEY,'');showLogin('Session expired. Please sign in again.')}else{showLogin('Can’t reach the server. Check your connection and reopen the app.')}}};

$('#so').onclick=async()=>{try{await post('/logout',{})}catch(_){}TOK='';PW='';LS.set(KEY,'');LS.set('bss-sheet','');SHEET=null;$('#menu').hidden=true;showLogin('Signed out.')};
$('#rf').onclick=()=>{load();toast('Refreshed')};$('#mn').onclick=()=>{$('#menu').hidden=!$('#menu').hidden};document.addEventListener('click',e=>{if(!e.target.closest('#menu,#mn'))$('#menu').hidden=true});
const load=async()=>{try{const t=new Date();t.setHours(0,0,0,0);const from=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;

Object.keys(r.days||{}).sort().forEach(d=>Object.keys(r.days[d]).sort().forEach(t=>{const v=r.days[d][t];if(!v)return;const s={d,t,n:v.n||'',p:v.p||'',at:v.at||0,exp:v.exp||0};if(v.s==='pending')P.push(s);else if(v.s==='booked'){const[y,m,x]=d.split('-').map(Number),[a,b]=t.split(':').map(Number);if(new Date(y,m-1,x,a,b).getTime()>Date.now()-36e5)U.push(s)}}));
const more=DATA.ready&&P.length>DATA.pend.length;DATA={pend:P,up:U,rev:(rv.reviews||[]).filter(x=>!x.ok),ready:1};$('#net').hidden=true;draw();if(more)toast('New request');
const n=P.length;document.title=(n?`(${n}) `:'')+'Citas';try{n?navigator.setAppBadge&&navigator.setAppBadge(n):navigator.clearAppBadge&&navigator.clearAppBadge()}catch(_){}
}catch(e){if(e===401){TOK='';LS.set(KEY,'');showLogin('Session expired. Please sign in again.')}else $('#net').hidden=false}};
const act=async(kind,s)=>{try{await post('/admin/slot',{date:s.d,time:s.t,s:kind==='ok'?'booked':null,note:''});SHEET={kind,s,es:ES};LS.set('bss-sheet',JSON.stringify(SHEET));await load()}catch(_){toast('Couldn’t save. Try again.')}};
const free=async s=>{if(!confirm('Free up '+sh(s.d)+' at '+fmtT(tmin(s.t))+'?'))return;try{await post('/admin/slot',{date:s.d,time:s.t,s:null,note:''});await load()}catch(_){toast('Couldn’t save.')}};
const view=s=>{SHEET={kind:'view',s,es:ES};LS.set('bss-sheet',JSON.stringify(SHEET));draw()};
const who=s=>h('div',{class:'who'},(s.n||'(no name)')+(s.p?' · '+fmtPh(s.p):''));
const cardP=s=>h('div',{class:'cd'+(HL===s.d+'-'+s.t.replace(':','')?' hl':''),id:'c'+s.d.replace(/-/g,'')+s.t.replace(':','')},h('div',{class:'when'},sh(s.d)+' · '+fmtT(tmin(s.t))),who(s),s.exp?h('small',{},'Held until '+new Date(s.exp).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'})):'',h('div',{class:'row'},h('button',{class:'b',onclick:()=>act('ok',s)},'Approve'),h('button',{class:'b g',onclick:()=>act('no',s)},'Reject')));
const cardU=s=>h('div',{class:'cd'},h('div',{class:'when'},fmtT(tmin(s.t))),who(s),h('div',{class:'row'},h('button',{class:'b g',onclick:()=>view(s)},'Text client'),h('a',{class:'b g',href:remHref(s)},'Reminder'),h('button',{class:'b g',onclick:()=>free(s)},'Cancel')));
const cardR=x=>h('div',{class:'cd'},h('div',{class:'when st'},'★'.repeat(x.r)+'☆'.repeat(5-x.r)),h('div',{class:'who'},x.n,x.s?' · '+x.s:''),h('p',{style:'margin-top:6px;color:var(--mu)'},x.t),h('div',{class:'row'},h('button',{class:'b',onclick:()=>rev(x,'approve')},'Approve'),h('button',{class:'b g',onclick:()=>rev(x,'delete')},'Delete')));
const rev=async(x,op)=>{try{await post('/admin/review',{id:x.id,op});await load()}catch(_){toast('Couldn’t save.')}};
const draw=()=>{const T=$('#tabs'),L=$('#list');T.textContent='';[['p','Pending',DATA.pend.length],['u','Upcoming',DATA.up.length],['r','Reviews',DATA.rev.length]].forEach(([k,n,c])=>T.append(h('button',{'aria-selected':TAB===k,onclick:()=>{TAB=k;draw()}},n,c&&k!=='u'?h('i',{},c):'')));
L.textContent='';
if(TAB==='p'){if(!DATA.pend.length)L.append(h('p',{class:'mt'},'No requests waiting. New ones show up here.'));DATA.pend.forEach(s=>L.append(cardP(s)))}
else if(TAB==='u'){if(!DATA.up.length)L.append(h('p',{class:'mt'},'No approved appointments coming up.'));let last='';DATA.up.forEach(s=>{if(s.d!==last){last=s.d;L.append(h('div',{class:'dh'},fmtD(s.d)))}L.append(cardU(s))})}
else{if(!DATA.rev.length)L.append(h('p',{class:'mt'},'No reviews waiting.'));DATA.rev.forEach(x=>L.append(cardR(x)))}

const ta=h('textarea',{rows:5}),go=h('a',{class:'b'},'Text '+(s.n||'client')),rm=h('a',{class:'b g',href:remHref(s)},'Add to Reminders');ta.value=S.msg;
const up=()=>{S.msg=ta.value;go.href=smsHref(s.p,ta.value);LS.set('bss-sheet',JSON.stringify(S))};ta.oninput=up;go.href=smsHref(s.p,ta.value);
el.textContent='';el.append(h('button',{class:'lang',onclick:()=>{S.es=!S.es;S.msg=null;sheet()}},S.es?'ES → EN':'EN → ES'),h('h2',{},no?'Rejected':S.kind==='view'?'Text client':'Approved ✓'),h('div',{style:'color:var(--mu)'},sh(s.d)+' · '+fmtT(tmin(s.t))+' · '+(s.n||'')+(s.p?' · '+fmtPh(s.p):'')),s.p?'':h('div',{style:'color:#ffb020;margin-top:6px'},'No phone number saved for this request: pick the chat yourself.'),ta,h('div',{class:'row'},go,no?'':rm),h('div',{class:'row'},h('button',{class:'b g',onclick:()=>navigator.clipboard&&navigator.clipboard.writeText(ta.value).then(()=>toast('Copied ✓'))},'Copy'),h('button',{class:'b g',onclick:()=>{SHEET=null;LS.set('bss-sheet','');sheet()}},'Done')));el.hidden=false};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&IN)load()});addEventListener('online',()=>IN&&load());
start();
</script></body></html>
